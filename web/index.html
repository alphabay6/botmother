<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BotMother Admin — Login</title>
  <meta name="description" content="BotMother Admin Panel - Secure Login">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">🤖</div>
      <h1>BotMother Admin</h1>
      <p>Enter your admin password to continue</p>
    </div>

    <div id="error-msg" class="error-msg">
      ❌ Invalid password. Please try again.
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="password-input">Admin Password</label>
        <input
          type="password"
          id="password-input"
          class="form-input"
          placeholder="Enter password..."
          autocomplete="current-password"
          autofocus
        >
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">
        <span id="btn-text">🔐 Login to Dashboard</span>
      </button>
    </form>

    <p style="text-align:center; color: var(--text-muted); font-size:12px; margin-top:20px;">
      🔒 Secured access — admin only
    </p>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const btnText = document.getElementById('btn-text');
    const loginBtn = document.getElementById('login-btn');

    // Check if already logged in
    const token = localStorage.getItem('admin_token');
    if (token) {
      // Verify token is still valid
      fetch('/api/stats', { headers: { 'X-Admin-Token': token } })
        .then(r => { if (r.ok) window.location.href = '/dashboard'; })
        .catch(() => {});
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password-input').value;
      if (!password) return;

      loginBtn.disabled = true;
      btnText.textContent = '⏳ Logging in...';
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('admin_token', data.token);
          btnText.textContent = '✅ Success! Redirecting...';
          setTimeout(() => { window.location.href = '/dashboard'; }, 500);
        } else {
          errorMsg.style.display = 'block';
          loginBtn.disabled = false;
          btnText.textContent = '🔐 Login to Dashboard';
          document.getElementById('password-input').value = '';
          document.getElementById('password-input').focus();
        }
      } catch (err) {
        errorMsg.textContent = '❌ Connection error. Is the bot running?';
        errorMsg.style.display = 'block';
        loginBtn.disabled = false;
        btnText.textContent = '🔐 Login to Dashboard';
      }
    });
  </script>
</body>
</html>
